<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; font-family: var(--font-sans); display: flex; }
  .half { flex: 1; padding: 34px; display: flex; align-items: center; gap: 18px; }
  .day { background: #F4F0E8; }
  .night { background: #1E2530; }
  .word { display: flex; flex-direction: column; line-height: 1; }
  .es { font-size: 13px; letter-spacing: 5px; }
  .ci { font-size: 42px; font-weight: 500; letter-spacing: 0.5px; margin-top: 3px; }
</style></head>
<body>
  <div class="half day">
    <img src="../assets/symbol-bronze.svg" width="58" height="43" alt="" />
    <div class="word"><span class="es" style="color:#B5863C">estudio</span><span class="ci" style="color:#1C1E22">cimiento</span></div>
  </div>
  <div class="half night">
    <img src="../assets/symbol-copper.svg" width="58" height="43" alt="" />
    <div class="word"><span class="es" style="color:#D89149">estudio</span><span class="ci" style="color:#F2F0EA">cimiento</span></div>
  </div>
</body></html>
