<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: #1E2530; font-family: var(--font-sans); }
  .row { display: flex; gap: 12px; }
  .sw { flex: 1; border-radius: var(--radius-md); border: 1px solid rgba(242,240,234,0.12); overflow: hidden; }
  .chip { height: 72px; }
  .meta { padding: 8px 10px; }
  .nm { font-size: var(--fs-body-sm); font-weight: 500; color: #F2F0EA; }
  .hex { font-family: var(--font-mono); font-size: var(--fs-caption); color: #8A93A0; }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#1E2530"></div><div class="meta"><div class="nm">acero · fondo</div><div class="hex">#1E2530</div></div></div>
    <div class="sw"><div class="chip" style="background:#2A323F"></div><div class="meta"><div class="nm">superficie</div><div class="hex">#2A323F</div></div></div>
    <div class="sw"><div class="chip" style="background:#8A93A0"></div><div class="meta"><div class="nm">gris frío</div><div class="hex">#8A93A0</div></div></div>
    <div class="sw"><div class="chip" style="background:#D89149"></div><div class="meta"><div class="nm">cobre · acento</div><div class="hex">#D89149</div></div></div>
    <div class="sw"><div class="chip" style="background:#F2F0EA"></div><div class="meta"><div class="nm">crema · texto</div><div class="hex">#F2F0EA</div></div></div>
  </div>
</body></html>
