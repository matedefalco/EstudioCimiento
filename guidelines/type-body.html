<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); max-width: 640px; }
  .meta { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--text-muted); display: block; margin-top: 4px; }
  .lg { font-size: var(--fs-body-lg); line-height: 1.6; }
  .bd { font-size: var(--fs-body); line-height: 1.65; color: var(--text-secondary); margin-top: 14px; }
  .cap { font-size: var(--fs-caption); color: var(--text-muted); margin-top: 14px; }
</style></head>
<body>
  <div class="lg">construimos la base digital de tu negocio y te dejamos al mando.<span class="meta">body-lg · 18 / 1.6</span></div>
  <div class="bd">captamos cómo funciona tu negocio y lo bajamos a estructura. la tecnología es el vehículo; el resultado es que terminás autónomo.<span class="meta">body · 16 / 1.65 · secondary</span></div>
  <div class="cap">precio fijo, entrega rápida.<span class="meta">caption · 12</span></div>
</body></html>
