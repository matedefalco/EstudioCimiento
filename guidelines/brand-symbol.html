<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px; background: var(--surface-page); font-family: var(--font-sans); display: flex; gap: 36px; align-items: center; }
  .big { background: var(--surface-raised); border: 1px solid var(--border-hairline); border-radius: var(--radius-lg); padding: 26px; }
  .note { max-width: 320px; }
  .note h4 { margin: 0 0 8px; font-weight: 500; font-size: var(--fs-h4); color: var(--text-primary); }
  .note p { margin: 0; color: var(--text-secondary); font-size: var(--fs-body-sm); line-height: 1.6; }
  .ovl { font-size: var(--fs-overline); letter-spacing: 0.32em; color: var(--text-accent); font-weight: 500; margin-bottom: 10px; }
</style></head>
<body>
  <div class="big">
    <svg width="180" height="134" viewBox="0 0 62 46" aria-hidden="true">
      <path d="M3 42 H59" fill="none" stroke="#B5863C" stroke-width="1.5" stroke-linecap="round"/>
      <path d="M7 40 V27 H25 V14 H43 V3 H59" fill="none" stroke="#B5863C" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>
  <div class="note">
    <div class="ovl">el símbolo</div>
    <h4>una base, y la subida</h4>
    <p>trazo de peso único, geométrico y premium. la hairline marca el cimiento; los escalones ascienden hacia el cliente al mando. el metálico vive acá: bronce en día, cobre en noche.</p>
  </div>
</body></html>
