<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 30px; background: var(--surface-page); font-family: var(--font-sans); display: flex; gap: 28px; }
  .col { text-align: center; }
  .box { width: 110px; height: 72px; background: var(--surface-raised); border-radius: var(--radius-md); border: 1px solid var(--border-hairline); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 12px; }
</style></head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="nm">xs</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="nm">sm</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="nm">md</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="nm">lg</div></div>
</body></html>
