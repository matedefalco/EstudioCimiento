<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; }
  .sw { flex: 1; border-radius: var(--radius-md); border: 1px solid var(--border-hairline); overflow: hidden; }
  .chip { height: 72px; }
  .meta { padding: 8px 10px; }
  .nm { font-size: var(--fs-body-sm); font-weight: 500; color: var(--text-primary); }
  .hex { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--text-secondary); }
</style></head>
<body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:#1C1E22"></div><div class="meta"><div class="nm">tinta</div><div class="hex">#1C1E22</div></div></div>
    <div class="sw"><div class="chip" style="background:#B5863C"></div><div class="meta"><div class="nm">bronce · acento</div><div class="hex">#B5863C</div></div></div>
    <div class="sw"><div class="chip" style="background:#8A8276"></div><div class="meta"><div class="nm">gris cálido</div><div class="hex">#8A8276</div></div></div>
    <div class="sw"><div class="chip" style="background:#F4F0E8"></div><div class="meta"><div class="nm">crema · fondo</div><div class="hex">#F4F0E8</div></div></div>
  </div>
</body></html>
