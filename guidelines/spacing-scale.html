<!-- @dsCard group="Spacing" viewport="700x160" name="Escala de espaciado" subtitle="Grilla base 8px — aire generoso por defecto" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-sans); }
  .row { display: flex; gap: 14px; align-items: flex-end; }
  .col { text-align: center; }
  .bar { background: var(--accent); border-radius: var(--radius-xs); width: 26px; }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 6px; }
</style></head>
<body>
  <div class="row">
    <div class="col"><div class="bar" style="height:4px"></div><div class="nm">1·4</div></div>
    <div class="col"><div class="bar" style="height:8px"></div><div class="nm">2·8</div></div>
    <div class="col"><div class="bar" style="height:12px"></div><div class="nm">3·12</div></div>
    <div class="col"><div class="bar" style="height:16px"></div><div class="nm">4·16</div></div>
    <div class="col"><div class="bar" style="height:24px"></div><div class="nm">5·24</div></div>
    <div class="col"><div class="bar" style="height:32px"></div><div class="nm">6·32</div></div>
    <div class="col"><div class="bar" style="height:48px"></div><div class="nm">7·48</div></div>
    <div class="col"><div class="bar" style="height:64px"></div><div class="nm">8·64</div></div>
    <div class="col"><div class="bar" style="height:96px"></div><div class="nm">9·96</div></div>
  </div>
</body></html>
