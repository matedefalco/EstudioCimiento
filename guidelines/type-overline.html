<!-- @dsCard group="Type" viewport="700x150" name="Overline + mono" subtitle="Eyebrow de tracking ancho y números tabulares" -->
<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); display: flex; gap: 48px; align-items: flex-start; }
  .meta { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--text-muted); display: block; margin-top: 8px; }
  .ovl { font-size: var(--fs-overline); letter-spacing: 0.32em; text-transform: lowercase; color: var(--text-accent); font-weight: 500; }
  .mono { font-family: var(--font-mono); font-size: 22px; color: var(--text-primary); }
</style></head>
<body>
  <div><div class="ovl">estudio · el proceso</div><span class="meta">overline · 11 · 0.32em</span></div>
  <div><div class="mono">01 · 240 hs · $1.200</div><span class="meta">mono · datos / tablas</span></div>
</body></html>
