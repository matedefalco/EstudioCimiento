<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-sans); display: flex; gap: 18px; }
  .col { text-align: center; }
  .box { width: 76px; height: 60px; background: var(--surface-raised); border: 1.5px solid var(--accent); }
  .nm { font-family: var(--font-mono); font-size: 10px; color: var(--text-secondary); margin-top: 8px; }
</style></head>
<body>
  <div class="col"><div class="box" style="border-radius:4px"></div><div class="nm">xs · 4</div></div>
  <div class="col"><div class="box" style="border-radius:6px"></div><div class="nm">sm · 6</div></div>
  <div class="col"><div class="box" style="border-radius:10px"></div><div class="nm">md · 10</div></div>
  <div class="col"><div class="box" style="border-radius:16px"></div><div class="nm">lg · 16</div></div>
  <div class="col"><div class="box" style="border-radius:24px"></div><div class="nm">xl · 24</div></div>
  <div class="col"><div class="box" style="border-radius:999px"></div><div class="nm">pill</div></div>
</body></html>
