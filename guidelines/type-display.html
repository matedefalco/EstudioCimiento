<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; padding: 26px; background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); }
  .meta { font-family: var(--font-mono); font-size: var(--fs-caption); color: var(--text-muted); }
  .stack > div { margin-bottom: 14px; }
  .d { font-size: 56px; font-weight: 500; line-height: 1.05; letter-spacing: -0.02em; }
  .h1 { font-size: var(--fs-h1); font-weight: 500; line-height: 1.1; }
  .h3 { font-size: var(--fs-h3); font-weight: 500; }
</style></head>
<body>
  <div class="stack">
    <div><div class="d">sistemas que ordenan</div><span class="meta">display · 500 · -0.02em</span></div>
    <div><div class="h1">cuatro fases, una base</div><span class="meta">h1 · 44 / 500</span></div>
    <div><div class="h3">te dejamos al mando</div><span class="meta">h3 · 24 / 500</span></div>
  </div>
</body></html>
